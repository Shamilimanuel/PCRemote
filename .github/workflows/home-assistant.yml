# Runs the Home Assistant integration's tests.
#
# Separate from the Android build because it shares nothing with it, and on
# Ubuntu because Home Assistant's test harness does not run on Windows: it
# allows Unix sockets through its network guard "because it's needed by
# asyncio", and Windows asyncio uses a local TCP pair instead, which the guard
# catches before any test starts.
name: Home Assistant integration

on:
  push:
    paths:
      - "integrations/home-assistant/**"
      - ".github/workflows/home-assistant.yml"
  pull_request:
    paths:
      - "integrations/home-assistant/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component

      - name: Which Home Assistant is this running against
        run: python -c "from homeassistant.const import __version__; print(__version__)"

      - name: Test
        run: pytest -q
        working-directory: integrations/home-assistant
