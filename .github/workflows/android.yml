name: Build Android app

# Replaces the EAS cloud build. Produces a signed APK and attaches it to a
# GitHub Release you can download straight onto the phone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'front-end/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Set version code from the run number
        # Android refuses to install an APK whose version code is lower than the
        # installed one, so derive it from the run number instead of hand-editing
        # app.json for every build. Starts above the last EAS build (2).
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const code = 100 + Number(process.env.GITHUB_RUN_NUMBER);
            cfg.expo.android.versionCode = code;
            cfg.expo.ios.buildNumber = String(code);
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('versionCode =', code);
          "

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        run: |
          # React Native ships native code for four processor types by default
          # and the APK carries all of them, though a phone uses exactly one.
          # Every Android phone made since roughly 2017 is arm64, and at ~96MB
          # the download was stalling in phone browsers.
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          grep '^reactNativeArchitectures' android/gradle.properties

          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Gradle signs release builds with Expo's throwaway debug key. Replace
          # that signature with the real one so the app installs as an update
          # over the copies built on EAS.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using build-tools $BUILD_TOOLS"

          UNSIGNED=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out dist/reveille.apk \
            "$UNSIGNED"

          # Fail loudly rather than shipping something the phone will reject.
          "$APKSIGNER" verify --print-certs dist/reveille.apk

          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reveille-apk
          path: front-end/dist/reveille.apk
          retention-days: 90

      - name: Publish a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          APK=front-end/dist/reveille.apk
          SIZE=$(( $(stat -c%s "$APK") / 1048576 ))
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)

          {
            echo "Android APK built from \`${GITHUB_SHA::7}\`."
            echo
            echo "Download **reveille.apk** below and open it on your phone to install."
            echo "It installs over any earlier version and keeps your saved PCs."
            echo
            echo "- Size: ${SIZE} MB"
            echo "- Needs a 64-bit ARM phone (anything from roughly 2017 onwards)"
            echo "- SHA-256: \`${SUM}\`"
          } > notes.md

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Reveille $TAG" \
            --notes-file notes.md \
            --latest
        working-directory: .
