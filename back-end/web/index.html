<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reveille">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Reveille</title>
<style>
  /*
    The app's Midnight theme, in a browser. Same four-shadow clay recipe: two
    outside for the lift, two inside for the thickness, light from the top-left.
    Kept to one file so the agent can serve it without a build step.
  */
  :root {
    --ground: #12151F;
    --clay-hi: #1F2433;
    --clay-lo: #0C0F16;
    --ink: #E8ECF7;
    --ink-2: #98A2BA;
    --ink-3: #646E88;
    --dawn: #FFA061;
    --dusk: #5D8BFF;
    --dusk-deep: #3D66E0;
    --moss: #4FD69A;
    --danger: #FF6B84;
    --shadow: rgba(0,0,0,.62);
    --shine: rgba(255,255,255,.055);
    --radius: 24px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 600 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    min-height: 100vh;
    overscroll-behavior: none;
  }
  main { max-width: 460px; margin: 0 auto; }

  .clay {
    background: linear-gradient(145deg, var(--clay-hi), var(--clay-lo));
    box-shadow:
      10px 10px 22px var(--shadow),
      -7px -7px 16px var(--shine),
      inset -3px -3px 9px var(--shadow),
      inset 4px 4px 10px var(--shine);
  }
  .clay-in {
    background: linear-gradient(145deg, var(--clay-lo), var(--clay-hi));
    box-shadow: inset 5px 5px 12px var(--shadow), inset -4px -4px 10px var(--shine);
  }

  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin: 6px 0 16px; }

  /* ---------- sign in ---------- */
  #gate { display: grid; gap: 14px; }
  #gate p { color: var(--ink-2); font-size: 14px; font-weight: 600; margin: 0; line-height: 1.55; }
  input {
    width: 100%; border: 0; border-radius: 18px; padding: 15px;
    font: 600 15px ui-monospace, Consolas, monospace; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--dusk); outline-offset: 2px; }

  button {
    border: 0; font: inherit; cursor: pointer; color: var(--ink);
    border-radius: 18px; padding: 15px;
    transition: transform .12s cubic-bezier(.34,1.5,.6,1), box-shadow .12s;
  }
  button:active { transform: scale(.95); }
  .primary {
    background: linear-gradient(145deg, var(--dusk), var(--dusk-deep));
    color: #fff; font-weight: 800;
    box-shadow: 8px 8px 18px var(--shadow), inset 2px 2px 6px rgba(255,255,255,.35);
  }

  /* ---------- header ---------- */
  .card {
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .name { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  .addr { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-top: 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    border-radius: 999px; padding: 7px 12px; font-size: 11.5px; font-weight: 800;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .uptime { text-align: center; font-size: 11.5px; color: var(--ink-3); font-weight: 700; margin: 0 0 14px; }

  /* ---------- buttons ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .blob {
    position: relative; overflow: hidden;
    border-radius: 26px; padding: 20px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    font-size: 12.5px; font-weight: 800; min-height: 104px; justify-content: center;
  }
  .blob svg { width: 28px; height: 28px; }
  .blob[disabled] { opacity: .42; }
  .blob.danger { color: var(--danger); }
  .blob.wide { grid-column: 1 / -1; flex-direction: row; min-height: 0; padding: 15px; gap: 10px; }
  .blob.wide svg { width: 19px; height: 19px; }

  /* the hold-to-confirm fill: rises from the bottom, deepens as it climbs */
  .charge {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: var(--danger); opacity: 0; pointer-events: none;
  }
  .charge.run { animation: fill var(--hold) linear forwards; }
  @keyframes fill {
    from { height: 0; opacity: .22; }
    to   { height: 100%; opacity: .92; }
  }
  .edge { position: absolute; left: 0; right: 0; height: 2.5px; background: var(--danger); opacity: 0; }
  .charge.run + .edge { animation: rise var(--hold) linear forwards; }
  @keyframes rise { from { bottom: 0; opacity: .9; } to { bottom: 100%; opacity: .35; } }

  .badge {
    position: absolute; top: 8px; right: 8px;
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    font-size: 12px; font-weight: 900;
    transform: scale(0); transition: transform .28s cubic-bezier(.34,1.8,.5,1);
  }
  .badge.show { transform: scale(1); }
  .badge.ok { background: var(--moss); }
  .badge.bad { background: var(--danger); }

  /* ---------- panels ---------- */
  .panel { border-radius: var(--radius); padding: 4px 16px; margin-top: 16px; }
  .panel h2 {
    font-size: 10px; font-weight: 800; letter-spacing: 1.2px; color: var(--ink-3);
    margin: 14px 0 8px; text-transform: uppercase;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-top: 1px solid rgba(255,255,255,.05); font-size: 12.5px;
  }
  .row span { color: var(--ink-3); font-weight: 700; }
  .row b { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .row b.muted { color: var(--ink-3); }

  .bar { margin: 13px 0; }
  .bar-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; }
  .bar-head span { color: var(--ink-2); font-weight: 700; }
  .bar-head b { font-weight: 800; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border-radius: 4px; background: var(--ground); overflow: hidden; margin-top: 6px; }
  .fill { height: 100%; border-radius: 4px; background: var(--moss); transition: width .5s ease; }
  .fill.warn { background: var(--dawn); }
  .bar small { display: block; color: var(--ink-3); font-size: 11px; font-weight: 600; margin-top: 5px; }

  .toast { text-align: center; font-size: 13px; font-weight: 800; margin-top: 16px; min-height: 18px; color: var(--moss); }
  .toast.bad { color: var(--danger); }

  .note { color: var(--ink-3); font-size: 11.5px; line-height: 1.55; font-weight: 600; margin-top: 18px; }
  .note b { color: var(--ink-2); }

  .hidden { display: none !important; }

  /* Countdown for a pending shutdown. */
  #pending {
    border-radius: 18px; padding: 12px 15px; margin-top: 14px;
    background: var(--ground); color: var(--dawn);
    font-size: 12.5px; font-weight: 700; text-align: center; line-height: 1.5;
  }
</style>
</head>
<body>
<main>

  <!-- ============ sign in ============ -->
  <section id="gate">
    <h1>Reveille</h1>
    <p id="gate-text">
      Paste the token this PC showed you. It stays in this browser and is never sent anywhere
      but to the PC itself.
    </p>
    <input id="token" type="password" inputmode="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="token">
    <button class="primary" id="signin">Connect</button>
    <p id="gate-error" class="hidden" style="color: var(--danger)"></p>
  </section>

  <!-- ============ control ============ -->
  <section id="app" class="hidden">
    <div class="card clay">
      <div>
        <div class="name" id="host">This PC</div>
        <div class="addr" id="addr"></div>
      </div>
      <div class="pill clay-in" id="pill"><span class="dot"></span><span id="pill-text">…</span></div>
    </div>
    <p class="uptime" id="uptime"></p>

    <div class="grid" id="buttons"></div>

    <div id="pending" class="hidden"></div>
    <p class="toast" id="toast"></p>

    <div class="panel clay-in" id="vitals-panel">
      <h2 id="vitals-title">This PC</h2>
      <div id="vitals"></div>
    </div>

    <div class="panel clay-in">
      <h2 id="net-title">Network</h2>
      <div id="net"></div>
    </div>

    <p class="note" id="wake-note"></p>
    <button id="signout" style="width:100%;margin-top:14px;background:transparent;color:var(--ink-3);font-size:13px">
      Forget this PC
    </button>
  </section>
</main>

<script src="sign.js"></script>
<script>
(function () {
  "use strict";

  var HOLD_MS = 1400;
  var KEY = 'reveille:token';

  /* ---------------------------------------------------------- language -- */

  var NL = (navigator.language || 'en').toLowerCase().startsWith('nl');
  var T = NL ? {
    connect: 'Verbinden', tokenHint: 'Plak de token die deze pc liet zien. Hij blijft in deze browser en gaat nergens anders heen dan naar de pc zelf.',
    wrongToken: 'Die token klopt niet.', noReach: 'Kan de pc niet bereiken.',
    awake: 'Wakker', asleep: 'Slaapt', checking: '…', up: 'aan',
    restart: 'Herstarten', sleep: 'Slaapstand', lock: 'Vergrendelen',
    shutDown: 'Afsluiten', cancel: 'Annuleren', bios: 'Naar BIOS',
    sent: 'verstuurd', nothingPending: 'Niets meer gepland',
    holdHint: 'Houd Afsluiten of Herstarten ingedrukt tot de knop vol is.',
    thisPc: 'Deze pc', network: 'Netwerk', processor: 'Processor', memory: 'Geheugen', disk: 'Schijf',
    cores: 'kernen', free: 'vrij', of: 'van',
    hostName: 'Computernaam', adapter: 'Adapter', ipAddress: 'IP-adres', port: 'Poort',
    macAddress: 'MAC-adres', responseTime: 'Reactietijd', biosRow: 'Naar BIOS',
    available: 'Beschikbaar', notSetUp: 'Niet ingesteld',
    countdown: 'Sluit af over', countdownR: 'Herstart over', tapCancel: '— tik op Annuleren om af te breken',
    forget: 'Deze pc vergeten',
    wakeNote: 'Wekken staat hier niet: een browser mag het weksignaal niet versturen. Gebruik daarvoor de Android-app, of zet de pc zelf aan.'
  } : {
    connect: 'Connect', tokenHint: 'Paste the token this PC showed you. It stays in this browser and is never sent anywhere but to the PC itself.',
    wrongToken: 'That token isn’t right.', noReach: 'Can’t reach the PC.',
    awake: 'Awake', asleep: 'Asleep', checking: '…', up: 'up',
    restart: 'Restart', sleep: 'Sleep', lock: 'Lock',
    shutDown: 'Shut down', cancel: 'Cancel', bios: 'Reboot to BIOS',
    sent: 'sent', nothingPending: 'Nothing left pending',
    holdHint: 'Hold Shut down or Restart until the button fills.',
    thisPc: 'This PC', network: 'Network', processor: 'Processor', memory: 'Memory', disk: 'Disk',
    cores: 'cores', free: 'free', of: 'of',
    hostName: 'Host name', adapter: 'Adapter', ipAddress: 'IP address', port: 'Port',
    macAddress: 'MAC address', responseTime: 'Response time', biosRow: 'Reboot to BIOS',
    available: 'Available', notSetUp: 'Not set up',
    countdown: 'Shutting down in', countdownR: 'Restarting in', tapCancel: '— tap Cancel to call it off',
    forget: 'Forget this PC',
    wakeNote: 'Wake isn’t here: a browser isn’t allowed to send the wake signal. Use the Android app for that, or switch the PC on yourself.'
  };

  /* ------------------------------------------------------------- icons -- */

  var ICON = {
    restart: '<path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1L20.5 8"/><path d="M20.5 3.5V8h-4.5"/><path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1L3.5 16"/><path d="M3.5 20.5V16H8"/>',
    sleep: '<path d="M20.5 14.4A8.4 8.4 0 0 1 9.6 3.5a8.4 8.4 0 1 0 10.9 10.9Z"/>',
    lock: '<rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
    shutdown: '<path d="M18 7.5A8.2 8.2 0 0 1 19.8 15"/><path d="M6.6 6.6A8.2 8.2 0 0 0 17.9 18.9"/><path d="M12 3.5V9"/><path d="M3.5 3.5l17 17"/>',
    cancel: '<circle cx="12" cy="12" r="8.4"/><path d="M6 6l12 12"/>',
    bios: '<rect x="5.5" y="5.5" width="13" height="13" rx="2.5"/><rect x="10" y="10" width="4" height="4" rx=".5"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/>'
  };
  function svg(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round">' + ICON[name] + '</svg>';
  }

  /* --------------------------------------------------------------- api -- */

  var token = localStorage.getItem(KEY) || '';

  /*
     The token signs each request and stays in this browser; it is no longer
     sent. See sign.js for why that matters on a network where the traffic is
     plain HTTP and cannot be anything else.
  */
  async function api(path, options) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 6000);
    try {
      var method = ((options && options.method) || 'GET').toUpperCase();
      var body = (options && typeof options.body === 'string') ? options.body : '';
      var signed = signRequest(token, method, path, body);

      var response = await fetch(path, Object.assign({}, options, {
        signal: controller.signal,
        headers: Object.assign({
          Authorization: signed.authorization,
          'Content-Type': 'application/json'
        }, (options && options.headers) || {})
      }));
      if (response.status === 401) throw new Error('401');
      if (!response.ok) throw new Error(String(response.status));

      /* Read the text, because the reply's signature covers the exact bytes. */
      var text = await response.text();
      if (!verifyResponse(token, signed.nonce, text, response.headers.get('X-Reveille-Signature'))) {
        throw new Error('That reply did not come from your PC.');
      }
      return text ? JSON.parse(text) : {};
    } finally {
      clearTimeout(timer);
    }
  }

  /* -------------------------------------------------------------- gate -- */

  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var gateError = document.getElementById('gate-error');
  document.getElementById('gate-text').textContent = T.tokenHint;
  document.getElementById('signin').textContent = T.connect;
  document.getElementById('signout').textContent = T.forget;
  document.getElementById('wake-note').innerHTML = T.wakeNote;

  async function signIn(candidate) {
    token = candidate;
    try {
      await api('/health');
      localStorage.setItem(KEY, token);
      gate.classList.add('hidden');
      app.classList.remove('hidden');
      build();
      poll();
      setInterval(poll, 5000);
      return true;
    } catch (err) {
      token = '';
      gateError.textContent = err.message === '401' ? T.wrongToken : T.noReach;
      gateError.classList.remove('hidden');
      return false;
    }
  }

  document.getElementById('signin').addEventListener('click', function () {
    var value = document.getElementById('token').value.trim();
    if (value) signIn(value);
  });
  document.getElementById('token').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('signin').click();
  });
  document.getElementById('signout').addEventListener('click', function () {
    localStorage.removeItem(KEY);
    location.reload();
  });

  /* ----------------------------------------------------------- buttons -- */

  var ACTIONS = [
    { key: 'restart', label: T.restart, icon: 'restart', hold: true },
    { key: 'sleep', label: T.sleep, icon: 'sleep' },
    { key: 'lock', label: T.lock, icon: 'lock' },
    { key: 'cancel', label: T.cancel, icon: 'cancel' },
    { key: 'shutdown', label: T.shutDown, icon: 'shutdown', hold: true, danger: true }
  ];

  var busy = false;
  var toast = document.getElementById('toast');

  function build() {
    var host = document.getElementById('buttons');
    host.innerHTML = '';
    ACTIONS.forEach(function (action) {
      var el = document.createElement('button');
      el.className = 'blob clay' + (action.danger ? ' danger' : '') +
                     (action.key === 'shutdown' ? ' wide' : '');
      el.style.setProperty('--hold', HOLD_MS + 'ms');
      el.innerHTML =
        (action.hold ? '<i class="charge"></i><i class="edge"></i>' : '') +
        svg(action.icon) + '<span>' + action.label + '</span>' +
        '<span class="badge"></span>';
      wire(el, action);
      host.appendChild(el);
    });
  }

  function wire(el, action) {
    var charge = el.querySelector('.charge');
    var badge = el.querySelector('.badge');
    var timer = null;

    function begin() {
      if (busy) return;
      if (!action.hold) { run(action, el, badge); return; }
      charge.classList.add('run');
      if (navigator.vibrate) navigator.vibrate(12);
      timer = setTimeout(function () {
        timer = null;
        charge.classList.remove('run');
        if (navigator.vibrate) navigator.vibrate([0, 20, 40, 20]);
        run(action, el, badge);
      }, HOLD_MS);
    }
    function end() {
      if (timer) { clearTimeout(timer); timer = null; }
      charge.classList.remove('run');
    }

    if (action.hold) {
      el.addEventListener('pointerdown', begin);
      el.addEventListener('pointerup', end);
      el.addEventListener('pointerleave', end);
      el.addEventListener('pointercancel', end);
      // Stop the long press turning into a text selection or context menu.
      el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    } else {
      el.addEventListener('click', begin);
    }
  }

  function flash(badge, ok) {
    badge.textContent = ok ? '✓' : '✕';
    badge.className = 'badge show ' + (ok ? 'ok' : 'bad');
    setTimeout(function () { badge.className = 'badge'; }, 1600);
  }

  async function run(action, el, badge) {
    busy = true;
    toast.textContent = '';
    try {
      if (action.key === 'cancel') {
        await api('/cancel', { method: 'POST' });
        toast.textContent = T.nothingPending;
      } else {
        await api('/action', { method: 'POST', body: JSON.stringify({ action: action.key }) });
        toast.textContent = action.label + ' ' + T.sent;
      }
      toast.className = 'toast';
      flash(badge, true);
    } catch (err) {
      toast.className = 'toast bad';
      toast.textContent = err.message === '401' ? T.wrongToken : T.noReach;
      flash(badge, false);
    } finally {
      busy = false;
      setTimeout(poll, 2500);
    }
  }

  /* -------------------------------------------------------------- poll -- */

  var pill = document.getElementById('pill');
  var pillText = document.getElementById('pill-text');
  var seenBios = false;

  function gb(bytes) {
    return (bytes / 1073741824).toFixed(bytes >= 107374182400 ? 0 : 1) + ' GB';
  }
  function row(label, value, muted) {
    return '<div class="row"><span>' + label + '</span><b' + (muted ? ' class="muted"' : '') +
           '>' + value + '</b></div>';
  }
  function bar(label, percent, detail, warnAbove) {
    var warn = percent !== null && percent >= (warnAbove || 85);
    return '<div class="bar"><div class="bar-head"><span>' + label + '</span><b>' +
           (percent === null ? '—' : percent + '%') + '</b></div>' +
           '<div class="track"><div class="fill' + (warn ? ' warn' : '') +
           '" style="width:' + Math.max(2, percent || 0) + '%"></div></div>' +
           '<small>' + detail + '</small></div>';
  }

  async function poll() {
    var health;
    try {
      health = await api('/health');
    } catch (err) {
      pill.style.color = 'var(--ink-3)';
      pillText.textContent = T.asleep;
      document.getElementById('uptime').textContent = '';
      return;
    }

    pill.style.color = 'var(--moss)';
    pillText.textContent = T.awake;
    document.getElementById('host').textContent = health.hostname;

    var hours = Math.floor(health.uptimeSeconds / 3600);
    var minutes = Math.floor((health.uptimeSeconds % 3600) / 60);
    document.getElementById('uptime').textContent =
      T.up + ' ' + (hours ? hours + 'h ' : '') + minutes + 'm';

    var primary = (health.interfaces || [])[0];
    if (primary) document.getElementById('addr').textContent = primary.ip + ':' + location.port;

    // Vitals
    var s = health.stats;
    document.getElementById('vitals-title').textContent = T.thisPc;
    if (s) {
      var memUsed = s.memory.totalBytes - s.memory.freeBytes;
      var html = bar(T.processor, s.cpuPercent, s.cores + ' ' + T.cores) +
                 bar(T.memory, s.memory.usedPercent, gb(memUsed) + ' ' + T.of + ' ' + gb(s.memory.totalBytes));
      if (s.disk) {
        var used = Math.round(100 * (1 - s.disk.freeBytes / s.disk.totalBytes));
        html += bar(T.disk + ' ' + s.disk.drive, used, gb(s.disk.freeBytes) + ' ' + T.free, 90);
      }
      document.getElementById('vitals').innerHTML = html;
    }

    // Network
    document.getElementById('net-title').textContent = T.network;
    var net = row(T.hostName, health.hostname);
    if (primary) {
      net += row(T.adapter, primary.interface);
      net += row(T.ipAddress, primary.ip);
      net += row(T.port, location.port || '5533');
      net += row(T.macAddress, primary.mac.toUpperCase());
    }
    if (health.capabilities) {
      net += row(T.biosRow,
        health.capabilities.firmwareReboot ? T.available : T.notSetUp,
        !health.capabilities.firmwareReboot);
    }
    document.getElementById('net').innerHTML = net;

    // The BIOS button only exists on PCs set up for it.
    if (health.capabilities && health.capabilities.firmwareReboot && !seenBios) {
      seenBios = true;
      ACTIONS.push({ key: 'firmware', label: T.bios, icon: 'bios', hold: true, danger: true });
      build();
    }

    // Pending countdown
    var pendingEl = document.getElementById('pending');
    if (health.pending) {
      var left = health.pending.secondsRemaining;
      var when = left >= 60 ? Math.round(left / 60) + ' min' : left + 's';
      pendingEl.textContent =
        (health.pending.action === 'restart' ? T.countdownR : T.countdown) + ' ' + when + ' ' + T.tapCancel;
      pendingEl.classList.remove('hidden');
    } else {
      pendingEl.classList.add('hidden');
    }
  }

  /* -------------------------------------------------------------- boot -- */

  if (token) {
    signIn(token);
  } else {
    gate.classList.remove('hidden');
  }
})();
</script>
</body>
</html>
